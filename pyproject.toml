[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ecs-contract"
version = "0.1.0"
description = "Who owns what in an ECS task definition: a contract and a credential-free checker."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "tanya-ok" }]
keywords = ["aws", "ecs", "fargate", "secrets", "task-definition", "github-actions", "deployment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tanya-ok/ecs-contract"
Specification = "https://github.com/tanya-ok/ecs-contract/blob/main/SPEC.md"
Issues = "https://github.com/tanya-ok/ecs-contract/issues"

[project.scripts]
ecsc = "ecs_contract.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "mypy>=1.16",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecs_contract"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "SPEC.md", "LICENSE", "NOTICE"]
exclude = ["tests/denylist.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "N", "PTH", "C4"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
