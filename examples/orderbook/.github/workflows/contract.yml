# Runs on every pull request. Needs no credentials and no network access to AWS.
name: contract

on:
  pull_request:
    paths: ["ecs/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tanya-ok/ecs-contract@v0 # zizmor: ignore[unpinned-uses] pin a commit SHA in real callers
        with:
          parameters-file: ecs/parameters.json
          secrets-file: ecs/secrets.json
          reserved: APP_ENV IMAGE_TAG
