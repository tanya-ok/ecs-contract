[project]
site_name = "ecs-contract"
site_description = "Explicit ownership and cooperative serialization for ECS deployments."
site_url = "https://tanya-ok.github.io/ecs-contract/"
repo_url = "https://github.com/tanya-ok/ecs-contract"
repo_name = "tanya-ok/ecs-contract"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/overview.css"]
nav = [
  { "Home" = "index.md" },
  { "Demo" = "demo.md" },
  { "Ownership and migration" = "migration.md" },
  { "Deployment locking" = "serialization.md" },
  { "Reference" = [
  { "Infrastructure" = "infrastructure.md" },
  { "Permissions" = "permissions.md" },
  { "Common traps" = "traps.md" },
  { "Prior art" = "prior-art.md" },
] },
  { "For maintainers" = [
  { "Publication readiness" = "publication-readiness.md" },
  { "Development plan" = "development-plan.md" },
] },
]

[project.theme]
language = "en"
features = ["content.code.copy", "navigation.top", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
pymdownx.tasklist.custom_checkbox = true
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
